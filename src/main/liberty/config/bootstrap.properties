# Liberty Explorer Configuration
# These properties configure the Liberty runtime scanner

# Liberty runtime directory (defaults to wlp.install.dir if not set)
# Uncomment and set if you want to scan a different Liberty installation
#liberty.runtime.dir=/path/to/liberty/wlp

# Server configuration directory (defaults to server.config.dir if not set)
# Uncomment and set if you want to filter features based on a specific server.xml
#liberty.server.config.dir=/path/to/server/config

# Liberty runtime version (for display purposes)
liberty.runtime.version=26.0.0.6

# Gradle plugin version (for display purposes)
liberty.gradle.plugin.version=3.8

